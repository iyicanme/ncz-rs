<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCZ to DXF Converter - Convert Netcad NCZ Files Online</title>
  <meta name="description" content="Free online converter for Netcad .ncz drawings to DXF. Runs entirely in your browser, so your file is never uploaded. Open the result in AutoCAD, QGIS or any CAD program.">
  <link rel="canonical" href="https://ncz-convert.iyican.me/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ncz-convert.iyican.me/">
  <meta property="og:title" content="NCZ to DXF Converter">
  <meta property="og:description" content="Convert Netcad .ncz drawings to DXF in your browser. Free, no upload.">
  <meta name="twitter:card" content="summary">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "NCZ to DXF Converter",
    "url": "https://ncz-convert.iyican.me/",
    "description": "Converts Netcad .ncz drawings to DXF in the browser without uploading the file.",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript and WebAssembly",
    "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"},
    "author": {"@type": "Person", "name": "Emre Iyican", "url": "https://iyican.me/"}
  }
  </script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>NCZ to DXF Converter</h1>
    <p>Convert a Netcad <code>.ncz</code> drawing to DXF. The file is converted in your browser and is never uploaded.</p>
  </header>

  <main>
    <label id="drop-zone" for="file-input">
      <input id="file-input" type="file" accept=".ncz,.NCZ">
      <span id="drop-text">Drop an NCZ file here or <u>choose one</u></span>
    </label>

    <p id="status" role="status"></p>

    <section id="results" hidden>
      <div id="cards">
        <div class="card">
          <h2>File</h2>
          <dl id="file-info"></dl>
        </div>
        <div class="card">
          <h2>Contents</h2>
          <dl id="contents"></dl>
        </div>
        <div class="card" id="dxf-card">
          <h2>DXF</h2>
          <dl id="dxf-info"></dl>
        </div>
      </div>

      <div id="actions">
        <a id="download-dxf" class="button">Download DXF</a>
        <button id="toggle-details" class="button secondary" type="button" aria-expanded="false" aria-controls="details">Details</button>
      </div>

      <section id="details" hidden>
        <section id="detail-info"></section>

        <div id="toolbar">
          <div id="kind-filters" role="group" aria-label="Filter by kind"></div>
          <input id="search" type="search" placeholder="Search text, layer, kind…" aria-label="Search elements">
        </div>

        <div id="table-wrap">
          <table>
            <thead>
              <tr><th>#</th><th>Kind</th><th>Layer</th><th>Details</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <button id="show-more" type="button" hidden>Show more</button>
      </section>
    </section>
  </main>
</body>
</html>
