[package]
name = "nczrs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "nczrs"
path = "src/main.rs"
required-features = ["dxf"]

[[bin]]
name = "corpus-check"
path = "src/bin/corpus-check.rs"
required-features = ["dxf"]

[features]
default = ["dxf"]
dxf = ["dep:dxf", "dep:image"]

[dependencies]
bopper = { git = "https://github.com/iyicanme/bopper.git" }
dxf = { version = "0.6.0", default-features = false, features = [], optional = true }
# Must be the version the dxf crate uses, its thumbnail is an image of that crate.
image = { version = "0.25", default-features = false, features = ["bmp"], optional = true }
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
jiff = { version = "0.2", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# The DXF export needs random numbers and a clock, which the browser provides through wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
uuid = { version = "1", default-features = false, features = ["js"] }

# dxf 0.6.2 writes the extended data of polylines after their vertices, see vendor/dxf/PATCHED.md.
[patch.crates-io]
dxf = { path = "vendor/dxf" }

[profile.release]
opt-level = "s"
lto = true
